<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Clevertuna">
  <!-- One shape, thick enough to survive 16 pixels. The wave is the product:
       "read the current". The ground is bright so the icon reads on a light
       tab bar and a dark one alike — a black tile disappears into both. -->
  <defs>
    <linearGradient id="clevertuna-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#36f0b1"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#clevertuna-mark)"/>
  <path d="M5 20.5 C8.5 20.5 8.5 11.5 12.5 11.5 S16.5 20.5 20 20.5 S27 11.5 27 11.5"
        fill="none" stroke="#04121a" stroke-width="4.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
