<helmet>
  <style>
    body { margin: 0; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #0A84FF; } a:hover { color: #409CFF; }
    .mac {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 13px; letter-spacing: -0.005em; color: #F5F5F7;
    }
    /* Glass, built from layers rather than a filter: a translucent body, a
       specular rim brightest along the top edge, and a shadow that lifts it off
       whatever it is floating over. No backdrop-filter — the content behind it
       is real, so a live blur would cost paint without changing the reading. */
    .glass {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.11) 42%, rgba(255,255,255,0.07) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.42),
        inset 0 0 0 0.5px rgba(255,255,255,0.16),
        inset 0 -1px 0 rgba(255,255,255,0.10),
        0 8px 20px rgba(0,0,0,0.34);
    }
    .glass-quiet {
      background: linear-gradient(180deg, rgba(255,255,255,0.13), rgba(255,255,255,0.07));
      box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.30), inset 0 0 0 0.5px rgba(255,255,255,0.12);
    }
    /* Capsules: macOS 26 rounds controls to their full height. */
    .cap { display: inline-flex; align-items: center; justify-content: center; height: 30px; padding: 0 14px; border-radius: 15px; }
    .dim { color: rgba(245,245,247,0.62); }
    .hdr { font-size: 11px; font-weight: 590; letter-spacing: 0.035em; text-transform: uppercase; color: rgba(245,245,247,0.50); margin-bottom: 8px; }
    .row { display: flex; align-items: center; gap: 10px; min-height: 34px; }
  </style>
</helmet>

class Component extends DCLogic {
  hexToHsl(hex) {
    // Defensive: the colour editor can hand back short or 8-digit hex.
    let h = String(hex || '').trim().replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    if (h.length < 6 || !/^[0-9a-fA-F]{6}/.test(h)) return [211, 1, 0.52];
    const r = parseInt(h.slice(0, 2), 16) / 255;
    const g = parseInt(h.slice(2, 4), 16) / 255;
    const b = parseInt(h.slice(4, 6), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const l = (max + min) / 2;
    let s = 0, hue = 0;
    if (max !== min) {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) hue = ((g - b) / d + (g < b ? 6 : 0)) * 60;
      else if (max === g) hue = ((b - r) / d + 2) * 60;
      else hue = ((r - g) / d + 4) * 60;
    }
    return [hue, s, l];
  }

  hsl(h, s, l, a) {
    const hh = ((h % 360) + 360) % 360;
    const ss = Math.max(0, Math.min(1, s)) * 100;
    const ll = Math.max(0, Math.min(1, l)) * 100;
    return a === undefined
      ? 'hsl(' + hh.toFixed(1) + ' ' + ss.toFixed(1) + '% ' + ll.toFixed(1) + '%)'
      : 'hsl(' + hh.toFixed(1) + ' ' + ss.toFixed(1) + '% ' + ll.toFixed(1) + '% / ' + a + ')';
  }

  at(t, base) {
    const [h, s, l] = base;
    const hue = h + Math.sin(t * Math.PI * 1.15) * 104 - 30;
    const light = Math.max(0.44, Math.min(0.68, l + Math.sin(t * Math.PI) * 0.08));
    const sat = Math.max(s, 0.74);
    return { bg: this.hsl(hue, sat, light), glow: this.hsl(hue, sat, light, 0.55) };
  }

  renderVals() {

    const base = this.hexToHsl(glow);

    const gap = U.keyGap;
    const pct = (v, span) => (v / span * 100).toFixed(3) + '%';

    // physically occupies — which is what the keyboard itself does.

    for (const row of LAYOUT.rows) {

          h: pct(Math.max(row.h - gap, 0.1), U.height),
          radius: row.h < 0.6 ? '3px' : '5px',
          bg: c.bg,
          label: k.space ? '' : k.label,
          sub: k.sub ?? '',
          fs: k.size === 'tiny' ? '5px' : small ? '6px' : '9px',
          ink: 'rgba(255,255,255,0.92)',
        });
      }
    }

    // The touch surface and the two strips, drawn as what they are: regions of
    // the key field, outlined over the keys they cover.
    const regions = LAYOUT.zones.filter((z) => z.shape !== 'field').map((z) => ({
      l: pct(z.x, U.width),
      t: pct(z.y, U.height),
      w: pct(z.w, U.width),
      h: pct(z.h, U.height),
      radius: z.shape === 'strip' ? '4px' : '7px',
      ring: 'inset 0 0 0 1.5px rgba(255,255,255,0.80)',
      wash: z.shape === 'strip' ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.07)',
      caption: z.shape === 'region' ? 'Touch surface — the keys themselves' : '',
    }));

    const stops = [
      { ...this.at(0.05, base), at: '2px' },
      { ...this.at(0.5, base), at: '48px' },
      { ...this.at(0.95, base), at: '94px' },
    ].map((s) => ({ color: s.bg, glow: s.glow, at: s.at }));

    return {
      glow,
      bloomNear: this.hsl(base[0], Math.max(base[1], 0.74), 0.5, 0.30),
      bloomFar: this.hsl(base[0], Math.max(base[1], 0.74), 0.42, 0.12),
      deckRatio: (LAYOUT.unit.height / LAYOUT.unit.width * 100).toFixed(2) + '%',
      keys,
      regions,
      stops,
      light: [
        { name: 'Brightness', pct: '100%', at: '90px', value: '100%' },
        { name: 'Opacity', pct: '100%', at: '90px', value: '100%' },
      ],
      move: [
        { name: 'Speed', pct: '66%', at: '58px', value: '6689' },
        { name: 'Stretch', pct: '33%', at: '28px', value: '395' },
      ],
    };
  }
}
</script>
</body>
</html>
