<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #0A84FF; } a:hover { color: #409CFF; }
    .mac {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 13px; letter-spacing: -0.005em; color: #F5F5F7;
    }
    .glass {
      background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.12) 44%, rgba(255,255,255,0.08) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.46),
        inset 0 0 0 0.5px rgba(255,255,255,0.18),
        inset 0 -1px 0 rgba(255,255,255,0.10),
        0 10px 24px rgba(0,0,0,0.42);
    }
    .tile {
      background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.08));
      box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.34), inset 0 0 0 0.5px rgba(255,255,255,0.12);
    }
    .dim { color: rgba(245,245,247,0.62); }
    .key { font-size: 11px; color: rgba(245,245,247,0.55); font-variant-numeric: tabular-nums; }
    .modtitle { font-size: 11px; font-weight: 590; letter-spacing: 0.03em; color: rgba(245,245,247,0.55); }
  </style>
</helmet>

<div class="mac" style="width: 420px; height: 560px; position: relative; overflow: hidden;
  background:
    radial-gradient(80% 55% at 18% 8%, #4E3E86 0%, rgba(78,62,134,0) 62%),
    radial-gradient(85% 60% at 78% 96%, #8A3D5E 0%, rgba(138,61,94,0) 64%),
    linear-gradient(165deg, #2A2350 0%, #171A33 52%, #101322 100%);">

  <!-- the real menu bar, so the popover has somewhere to hang from -->
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 26px; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 12px; background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06)); box-shadow: inset 0 -0.5px 0 rgba(255,255,255,0.12);">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(245,245,247,0.75)" stroke-width="1.5" stroke-linecap="round"><path d="M12 4.5a7.5 7.5 0 1 0 7.5 7.5"/><path d="M12 4.5V12l5.3 5.3"/></svg>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(245,245,247,0.75)" stroke-width="1.5" stroke-linecap="round"><path d="M4 12a8 8 0 0 1 16 0"/><path d="M7.5 15a5 5 0 0 1 9 0"/><circle cx="12" cy="18.4" r="1.1" fill="rgba(245,245,247,0.75)" stroke="none"/></svg>
    <!-- ours, lit -->
    <div style="display: flex; align-items: center; justify-content: center; width: 24px; height: 20px; border-radius: 6px; background: rgba(255,255,255,0.22); box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.45);">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"><rect x="2.5" y="6.5" width="19" height="11" rx="2.6"/><path d="M6.5 10.5h1M10 10.5h1M13.5 10.5h1M17 10.5h1M8.5 14h7"/></svg>
    </div>
    <span class="dim" style="font-size: 12px;">9:41</span>
  </div>

  <!-- the popover -->
  <div class="glass" style="position: absolute; top: 34px; left: 22px; right: 22px; border-radius: 26px; padding: 12px; display: flex; flex-direction: column; gap: 10px;">

    <!-- device + brightness, the two things worth having without a window -->
    <div class="tile" style="border-radius: 18px; padding: 13px 14px;">
      <div style="display: flex; align-items: center; gap: 11px; margin-bottom: 13px;">
        <div style="width: 34px; height: 34px; border-radius: 11px; background: linear-gradient(180deg, rgba(255,255,255,0.26), rgba(255,255,255,0.10)); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.5);">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"><rect x="2.5" y="6.5" width="19" height="11" rx="2.6"/><path d="M6.5 10.5h1M10 10.5h1M13.5 10.5h1M17 10.5h1M8.5 14h7"/></svg>
        </div>
        <div style="flex: 1;">
          <div style="font-weight: 590;">CLVX S</div>
          <div class="dim" style="font-size: 11px;">Connected over Bluetooth</div>
        </div>
        <div style="width: 8px; height: 8px; border-radius: 50%; background: #30D158; box-shadow: 0 0 10px rgba(48,209,88,0.8);"></div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(245,245,247,0.7)" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
        <div style="flex: 1; height: 28px; border-radius: 14px; background: rgba(255,255,255,0.14); position: relative; overflow: hidden; box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.22);">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 76%; background: linear-gradient(180deg, #FFFFFF, #E6E6EA);"></div>
        </div>
      </div>
    </div>

    <!-- themes: one tap each, and the key that does it without opening this -->
    <div class="tile" style="border-radius: 18px; padding: 12px;">
      <div style="display: flex; align-items: baseline; margin-bottom: 10px;">
        <div class="modtitle" style="flex: 1;">Themes</div>
        <div style="font-size: 11px; color: #64B5FF;">Show All</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <sc-for list="{{themes}}" as="t" hint-placeholder-count="6">
          <div style="border-radius: 13px; padding: 7px; background: {{t.cell}}; box-shadow: {{t.ring}};">
            <div style="height: 34px; border-radius: 9px; background: {{t.swatch}}; box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.30);"></div>
            <div style="display: flex; align-items: baseline; gap: 4px; margin-top: 7px;">
              <div style="flex: 1; font-size: 11px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{t.name}}</div>
              <div class="key">{{t.key}}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- worked out rather than written down -->
    <div class="tile" style="border-radius: 18px; padding: 6px;">
      <div style="display: flex; align-items: center; gap: 11px; padding: 8px 8px;">
        <div style="width: 32px; height: 32px; border-radius: 10px; background: conic-gradient(from 210deg, #FF375F, #FF9F0A, #30D158, #0A84FF, #BF5AF2, #FF375F); box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.4);"></div>
        <div style="flex: 1;">
          <div style="font-weight: 500;">Random</div>
          <div class="dim" style="font-size: 11px;">A different theme, right now</div>
        </div>
        <div class="key">⌃⌥1</div>
      </div>
      <div style="height: 0.5px; background: rgba(255,255,255,0.12); margin: 0 8px;"></div>
      <div style="display: flex; align-items: center; gap: 11px; padding: 8px 8px;">
        <div style="width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, #FFAF00, #D22900 42%, #DFE600 72%, #61B723); box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.4);"></div>
        <div style="flex: 1;">
          <div style="font-weight: 500;">Wallpaper</div>
          <div class="dim" style="font-size: 11px;">Follows your desktop picture</div>
        </div>
        <div class="key">⌃⌥2</div>
      </div>
    </div>

    <!-- the two things that DO open a window, kept apart from the rest -->
    <div style="display: flex; gap: 10px;">
      <div class="tile" style="flex: 1; display: flex; align-items: center; gap: 9px; padding: 11px 13px; border-radius: 16px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5F5F7" stroke-width="1.6" stroke-linecap="round"><path d="M4 8h9M18 8h2M4 16h5M13 16h7"/><circle cx="15.5" cy="8" r="2.3"/><circle cx="11" cy="16" r="2.3"/></svg>
        <span style="font-weight: 500;">Builder</span>
      </div>
      <div class="tile" style="flex: 1; display: flex; align-items: center; gap: 9px; padding: 11px 13px; border-radius: 16px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5F5F7" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M21 12h-2.4M5.4 12H3M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7M18.4 18.4l-1.7-1.7M7.3 7.3 5.6 5.6"/></svg>
        <span style="font-weight: 500;">Settings</span>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const t = (name, key, swatch, glow, on) => ({
      name, key, swatch, glow,
      cell: on ? 'rgba(255,255,255,0.20)' : 'rgba(255,255,255,0.07)',
      ring: on
        ? 'inset 0 0.5px 0 rgba(255,255,255,0.5), inset 0 0 0 1px rgba(255,255,255,0.30)'
        : 'inset 0 0.5px 0 rgba(255,255,255,0.20)',
    });
    return {
      themes: [
        t('Deep Current', '⌃⌥3', '#00C8FF', 'rgba(0,200,255,0.45)', false),
        t('Magma', '⌃⌥4', 'linear-gradient(115deg,#5A0000,#FF3C00 34%,#FF5353 58%,#FFB100 80%,#FFE03A)', 'rgba(255,90,0,0.45)', true),
        t('Aurora', '', 'linear-gradient(115deg,#00C8FF,#505AFF 38%,#C83CFF 68%,#28DCB4)', 'rgba(120,90,255,0.42)', false),
        t('Tide', '⌃⌥5', '#00C8FF', 'rgba(0,200,255,0.40)', false),
        t('Nightshift', '', '#0B1470', 'rgba(20,30,180,0.40)', false),
        t('Spectrum', '', 'linear-gradient(115deg,#FF0000,#FFC800 26%,#00FF50 52%,#00A0FF 76%,#B400FF)', 'rgba(160,120,255,0.40)', false),
      ],
    };
  }
}
</script>
</body>
</html>
